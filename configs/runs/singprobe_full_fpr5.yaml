# Load AFTER configs/base.yaml. Preserve the existing SingProbe + Weighted
# recipe; only change sliding_window=64 to full causal history (0).
name: full_singprobe_context0_weighted_fpr5
data:
  max_samples: null
features:
  splits: null
probe:
  name: singprobe
  params:
    num_query_heads: 4
    num_kv_heads: 1
    head_dim: 64
    sliding_window: 0
    rms_norm_eps: 0.000001
    init_bias: 0.0
loss:
  name: singprobe_weighted
  params:
    temperature: 0.1
    beta_tau: 0.35
    detach_weights: true
training:
  learning_rate: 0.0003
evaluation:
  readouts: [max, mean, last]
  targets: [beavertails_test, wildguardtest]
  threshold_metric: fpr
  fpr_targets: [0.05]
