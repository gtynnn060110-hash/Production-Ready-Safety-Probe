# Full-data run requested after the pilot: full causal MQA, local risk window 40.
# Load AFTER configs/base.yaml. Calibration is validation-only FPR <= 5%.
name: full_mqa_rmattn_context0_risk40_weighted_fpr5
data:
  max_samples: null
features:
  splits: null
probe:
  name: mqa_rmattn
  params:
    context_window: 0  # no sliding-window limit; still causal
    risk_window: 40
    num_query_heads: 4
    num_kv_heads: 1
    head_dim: 64
    rms_norm_eps: 0.000001
    attention_chunk_size: 256
    mlp_hidden_sizes: [100, 100]
    internal_heads: 10
    partial_prefix_windows: true
loss:
  name: singprobe_weighted
  params:
    temperature: 0.1
    beta_tau: 0.35
    detach_weights: true
training:
  learning_rate: 0.0001
  epochs: 4
  log_every: 1000
evaluation:
  readouts: [max]
  targets: [beavertails_test, wildguardtest]
  threshold_metric: fpr
  fpr_targets: [0.05]
