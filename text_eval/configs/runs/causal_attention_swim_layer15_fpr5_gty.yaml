# Text-domain adaptation of the multimodal causal-attention + SWiM probe.
# Keep YHT's five task labels; use its shared Qwen block-15 feature cache.
name: causal_attention_swim_layer15_fpr5_gty
data:
  max_samples: null
features:
  model: /ssd/models/Qwen3.5-9B
  revision: null
  block_indices: [15]
  tap: block_output_pre_final_norm
probe:
  name: causal_attention
  params:
    mlp_hidden_size: 256
    attention_heads: 8
    dropout: 0.1
    query_chunk_size: 128
loss:
  name: swim_dynamic
  params:
    window_size: 16
    temperature: 1.0
    loss_ema_rho: 0.9
    head_weight_warmup_steps: 3000
    head_weight_min: 0.5
    head_weight_max: 2.0
training:
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  epochs: 1
  learning_rate: 0.0001
  weight_decay: 0.001
  warmup_ratio: 0.0
  lr_scheduler: constant
  selection_readout: ema_max
evaluation:
  readouts: [ema_max, max, mean, last]
  ema_alpha: 0.5
  targets: [beavertails_test, wildguardtest]
  threshold_metric: fpr
  fpr_targets: [0.05]
